name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: me-south-1
  ECR_REPOSITORY: app-backend
  ECS_CLUSTER: production-cluster
  ECS_SERVICE_BACKEND: laravel-backend
  ECS_SERVICE_FRONTEND: nextjs-frontend
  CONTAINER_NAME_BACKEND: laravel-app
  CONTAINER_NAME_FRONTEND: nextjs-app

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Backend image
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY-backend:$IMAGE_TAG \
            -f docker/Dockerfile.backend .
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY-backend:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY-backend:$IMAGE_TAG" \
            >> $GITHUB_OUTPUT

      - name: Build, tag and push Frontend image
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY-frontend:$IMAGE_TAG \
            -f docker/Dockerfile.frontend .
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY-frontend:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY-frontend:$IMAGE_TAG" \
            >> $GITHUB_OUTPUT

      - name: Deploy Backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: .aws/task-definition-backend.json
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy Frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: .aws/task-definition-frontend.json
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify deployment health
        run: |
          echo "Checking ECS service stability..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services \
              ${{ env.ECS_SERVICE_BACKEND }} \
              ${{ env.ECS_SERVICE_FRONTEND }}
          echo "Deployment successful — all services stable"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed — initiating rollback check"
          echo "Check rollback.yml for recovery steps"
